<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos Juntos - Calibración</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
        }
    </style>
</head>
<body>

    <a-scene embedded vr-mode-ui="enabled: false">
        <a-assets>
            <a-asset-item id="canasta-model" src="models/canasta.glb"></a-asset-item>
            <a-asset-item id="fruta-model" src="models/manzana.glb"></a-asset-item>
            <a-asset-item id="bomba-model" src="models/bomba.glb"></a-asset-item>
        </a-assets>

        <!-- Iluminación -->
        <a-light type="ambient" color="#FFFFFF" intensity="2"></a-light>
        <a-light type="directional" color="#FFFFFF" intensity="2" position="-1 3 2"></a-light>

        <!-- Cuadrícula de referencia en el suelo -->
        <a-grid color="#444" position="0 -2 -3"></a-grid>

        <!-- 1. CANASTA (Modifica scale y position aquí) -->
        <a-entity id="canasta" 
                  gltf-model="#canasta-model" 
                  position="0 -1.25 -3" 
                  scale="1 1 1">
        </a-entity>

        <!-- 2. FRUTA (Modifica scale y position aquí) -->
        <a-entity id="fruta" 
                  gltf-model="#fruta-model"
                  rotation="-65 0 0" 
                  position="-1 0 -3" 
                  scale="0.027 0.027 0.027">
        </a-entity>

        <!-- 3. BOMBA (Modifica scale y position aquí) -->
        <a-entity id="bomba" 
                  gltf-model="#bomba-model" 
                  position="1 0 -3" 
                  scale="0.27 0.27 0.27">
        </a-entity>

        <!-- Cámara fija -->
        <a-camera position="0 0 0"></a-camera>
    </a-scene>

</body>
</html>
