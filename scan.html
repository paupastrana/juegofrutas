<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Escáner de marcador</title>

    <!-- Versiones fijas que funcionan juntas: A-Frame 1.3.0 + AR.js 3.4.5 -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
    </style>

    <script>
        // Avisa a la página principal (index.html) que pasó algo
        function avisar(tipo) {
            window.parent.postMessage({ tipo: tipo }, "*");
        }

        // Se considera "detectado" si el marcador se mantiene visible 0.6 s seguidos
        // (evita falsos positivos de un solo fotograma).
        AFRAME.registerComponent("detector-marcador", {
            init: function () {
                let temporizador = null;
                let enviado = false;

                this.el.addEventListener("markerFound", () => {
                    if (enviado) return;
                    temporizador = setTimeout(() => {
                        enviado = true;
                        avisar("marcador-encontrado");
                    }, 600);
                });

                this.el.addEventListener("markerLost", () => {
                    clearTimeout(temporizador);
                });
            }
        });
    </script>
</head>
<body>

    <!-- La a-scene debe ir directamente dentro del body -->
    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        loading-screen="enabled: false"
        renderer="logarithmicDepthBuffer: true;"
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono;">

        <!-- Tu marcador personalizado: cambia el .patt para usar otro -->
        <a-marker preset="custom" type="pattern" url="markers/marcador.patt" detector-marcador></a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // Si la cámara falla (permiso denegado, etc.), se lo avisamos al juego
        document.querySelector("a-scene").addEventListener("camera-error", () => avisar("error-camara"));
    </script>
</body>
</html>
